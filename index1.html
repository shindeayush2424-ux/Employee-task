<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Task Management System</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f7fb;
    color:#222;
}

header{
    background:#1e3a8a;
    color:white;
    padding:25px;
    text-align:center;
}

header h1{
    margin-bottom:8px;
}

.container{
    width:90%;
    max-width:1200px;
    margin:25px auto;
}

.form-box{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.1);
    margin-bottom:25px;
}

.form-box h2{
    margin-bottom:15px;
    color:#1e3a8a;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:12px;
}

input, select, textarea{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:7px;
}

textarea{
    resize:none;
    height:45px;
}

button{
    border:none;
    padding:11px 18px;
    border-radius:7px;
    cursor:pointer;
    color:white;
    background:#2563eb;
    margin-top:10px;
}

button:hover{
    opacity:.85;
}

.fetch{
    background:#16a34a;
}

.update{
    background:#f59e0b;
}

.delete{
    background:#dc2626;
}

.clear{
    background:#64748b;
}

.message{
    margin:15px 0;
    padding:12px;
    border-radius:7px;
    background:#e0f2fe;
    display:none;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 3px 12px rgba(0,0,0,.1);
}

th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#1e3a8a;
    color:white;
}

tr:hover{
    background:#f1f5f9;
}

.actions button{
    margin:2px;
}

footer{
    text-align:center;
    padding:20px;
    margin-top:30px;
    background:#1e3a8a;
    color:white;
}

@media(max-width:700px){
    table{
        font-size:12px;
    }

    th,td{
        padding:7px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Employee Task Management System</h1>
    <p>Task Management Using REST API</p>
</header>

<div class="container">

    <!-- Task Form -->
    <div class="form-box">
        <h2>Employee / Task Details</h2>

        <div class="form-grid">

            <input type="number" id="employeeId"
                   placeholder="Employee ID">

            <input type="text" id="employeeName"
                   placeholder="Employee Name">

            <input type="text" id="taskTitle"
                   placeholder="Task Title">

            <textarea id="taskDescription"
                      placeholder="Task Description"></textarea>

            <select id="priority">
                <option value="">Select Priority</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>

            <select id="status">
                <option value="">Select Status</option>
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>

            <input type="date" id="deadline">

        </div>

        <button onclick="addTask()">Add Task</button>
        <button class="fetch" onclick="fetchTasks()">Get Tasks</button>
        <button class="update" onclick="updateTask()">Update Task</button>
        <button class="delete" onclick="deleteTask()">Delete Task</button>
        <button class="clear" onclick="clearForm()">Clear</button>

        <div class="message" id="message"></div>
    </div>

    <!-- Task Table -->
    <h2 style="margin-bottom:15px;">Employee Task List</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Employee</th>
                <th>Task</th>
                <th>Description</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Deadline</th>
            </tr>
        </thead>

        <tbody id="taskTable">
            <tr>
                <td colspan="7" style="text-align:center;">
                    Click "Get Tasks" to load data
                </td>
            </tr>
        </tbody>
    </table>

</div>

<footer>
    Employee Task Management System © 2026
</footer>


<script>

/*
    DEMO REST API
    JSONPlaceholder is used for demonstration.
    You can replace this URL with your actual Employee Task API.
*/

const API_URL = "https://jsonplaceholder.typicode.com/todos";

let selectedTaskId = null;


/* Show Message */
function showMessage(text){

    const message = document.getElementById("message");

    message.innerText = text;
    message.style.display = "block";

    setTimeout(()=>{
        message.style.display = "none";
    },3000);
}


/* GET - Retrieve Tasks */
async function fetchTasks(){

    try{

        const response = await fetch(API_URL);

        if(!response.ok){
            throw new Error("API request failed");
        }

        const data = await response.json();

        const tasks = data.slice(0,10);

        displayTasks(tasks);

        showMessage("Tasks loaded successfully!");

    }
    catch(error){

        showMessage("Error: Unable to connect to API.");

        console.log(error);
    }
}


/* Display Tasks */
function displayTasks(tasks){

    const table = document.getElementById("taskTable");

    table.innerHTML = "";

    tasks.forEach(task => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${task.id}</td>
            <td>Employee ${task.userId}</td>
            <td>${task.title}</td>
            <td>Task description</td>
            <td>${task.completed ? "High" : "Medium"}</td>
            <td>${task.completed ? "Completed" : "Pending"}</td>
            <td>-</td>
        `;

        row.onclick = function(){

            selectedTaskId = task.id;

            document.getElementById("employeeId").value =
                task.userId;

            document.getElementById("employeeName").value =
                "Employee " + task.userId;

            document.getElementById("taskTitle").value =
                task.title;

            document.getElementById("taskDescription").value =
                "Task description";

            document.getElementById("priority").value =
                task.completed ? "High" : "Medium";

            document.getElementById("status").value =
                task.completed ? "Completed" : "Pending";

        };

        table.appendChild(row);
    });
}


/* POST - Add Task */
async function addTask(){

    const task = {

        userId: document.getElementById("employeeId").value,

        title: document.getElementById("taskTitle").value,

        completed:
            document.getElementById("status").value === "Completed"
    };

    if(!task.userId || !task.title){

        showMessage("Please enter Employee ID and Task Title.");

        return;
    }

    try{

        const response = await fetch(API_URL, {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(task)
        });

        const data = await response.json();

        console.log(data);

        showMessage("Task added successfully!");

        clearForm();

    }
    catch(error){

        showMessage("Error while adding task.");

        console.log(error);
    }
}


/* PUT - Update Task */
async function updateTask(){

    if(!selectedTaskId){

        showMessage("First select a task from the table.");

        return;
    }

    const updatedTask = {

        userId:
            document.getElementById("employeeId").value,

        title:
            document.getElementById("taskTitle").value,

        completed:
            document.getElementById("status").value === "Completed"
    };

    try{

        const response = await fetch(
            `${API_URL}/${selectedTaskId}`,
            {
                method:"PUT",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify(updatedTask)
            }
        );

        const data = await response.json();

        console.log(data);

        showMessage("Task updated successfully!");

    }
    catch(error){

        showMessage("Error while updating task.");

        console.log(error);
    }
}


/* DELETE - Delete Task */
async function deleteTask(){

    if(!selectedTaskId){

        showMessage("First select a task.");

        return;
    }

    try{

        await fetch(
            `${API_URL}/${selectedTaskId}`,
            {
                method:"DELETE"
            }
        );

        showMessage("Task deleted successfully!");

        clearForm();

        selectedTaskId = null;

    }
    catch(error){

        showMessage("Error while deleting task.");

        console.log(error);
    }
}


/* Clear Form */
function clearForm(){

    document.getElementById("employeeId").value = "";
    document.getElementById("employeeName").value = "";
    document.getElementById("taskTitle").value = "";
    document.getElementById("taskDescription").value = "";
    document.getElementById("priority").value = "";
    document.getElementById("status").value = "";
    document.getElementById("deadline").value = "";

    selectedTaskId = null;
}

</script>

</body>
</html>
